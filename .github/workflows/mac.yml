name: Mac app

# Build AITodo.app di mesin macOS GitHub (tidak ada Mac di lingkungan pengembangan agen).
# Rilis otomatis: naikkan CFBundleShortVersionString di Resources/Info.plist (sama dengan VERSION),
# lalu merge ke main → tag v<versi> + GitHub Release berisi AITodo.zip.
# Aplikasi Android (android/) ikut dibangun di job `android` dan AITodo.apk masuk rilis yang sama
# (lihat ANDROID.md — butuh secret ANDROID_KEYSTORE_* supaya APK rilis bertanda tangan tetap).
on:
  push:
    paths:
      - "Sources/**"
      - "Resources/**"
      - "Tests/**"
      - "scripts/**"
      - "server/**"
      - "android/**"
      - "VERSION"
      - ".github/workflows/mac.yml"
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Baca versi
        id: ver
        run: |
          V=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" Resources/Info.plist)
          test "$V" = "$(cat VERSION)" || { echo "::error::Info.plist ($V) ≠ VERSION ($(cat VERSION))"; exit 1; }
          echo "tag=v$V" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/v$V" >/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      # klien Swift (Client.swift) diuji terhadap server Go asli
      - name: Tes klien terhadap server
        run: ./scripts/test-client.sh

      - name: Build AITodo.app (universal)
        run: ARCH=universal ./scripts/build.sh

      - name: Cek bundle
        run: |
          codesign -d -r- build/AITodo.app 2>&1 | grep -q 'designated => identifier "id.local.aitodo"$'
          lipo -archs build/AITodo.app/Contents/MacOS/AITodo
          plutil -lint build/AITodo.app/Contents/Info.plist

      - name: Zip
        run: |
          mkdir -p dist
          ditto -c -k --keepParent build/AITodo.app dist/AITodo.zip

      - name: Tanda tangani AITodo.zip
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.ver.outputs.exists == 'false'
        env:
          AITODO_SIGNING_KEY: ${{ secrets.AITODO_SIGNING_KEY }}
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          if [ -z "$AITODO_SIGNING_KEY" ]; then
            echo "::warning::Secret AITODO_SIGNING_KEY belum diatur → rilis tanpa tanda tangan (update otomatis nonaktif)"
            exit 0
          fi
          swift scripts/sign-release.swift sign dist/AITodo.zip "$TAG" > dist/AITodo.zip.sig

      - uses: actions/upload-artifact@v4
        with:
          name: AITodo
          path: |
            dist/AITodo.zip
            dist/AITodo.zip.sig
          if-no-files-found: warn

    outputs:
      tag: ${{ steps.ver.outputs.tag }}
      exists: ${{ steps.ver.outputs.exists }}

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - name: Tes unit & build debug
        working-directory: android
        run: ./gradlew --no-daemon testDebugUnitTest assembleDebug
      - name: Build rilis bertanda tangan
        working-directory: android
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          mkdir -p ../dist
          if [ -z "$ANDROID_KEYSTORE_B64" ]; then
            echo "::warning::Secret ANDROID_KEYSTORE_B64 belum diatur → rilis tanpa AITodo.apk (lihat ANDROID.md)"
            cp app/build/outputs/apk/debug/app-debug.apk ../dist/AITodo-debug.apk
            exit 0
          fi
          echo "$ANDROID_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/aitodo.jks"
          ANDROID_KEYSTORE_FILE="$RUNNER_TEMP/aitodo.jks" ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk ../dist/AITodo.apk
          rm -f "$RUNNER_TEMP/aitodo.jks"
      - uses: actions/upload-artifact@v4
        with:
          name: AITodo-android
          path: dist/*.apk

  release:
    needs: [build, android]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.build.outputs.exists == 'false'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Rilis otomatis (push ke main, versi belum dirilis)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build.outputs.tag }}
          name: AI Todo ${{ needs.build.outputs.tag }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          fail_on_unmatched_files: false
          files: |
            dist/AITodo.zip
            dist/AITodo.zip.sig
            dist/AITodo.apk

# Dummy: memicu ulang rilis v0.19.0 (sebelumnya tersendat kuota GitHub)
