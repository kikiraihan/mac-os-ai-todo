name: Deploy ke VPS

on:
  push:
    branches: [main]
    # Perubahan yang hanya menyentuh aplikasi Mac / dokumentasi tidak perlu
    # me-restart server.
    paths:
      - "server/**"
      - "web/**"
      - "Dockerfile"
      - ".dockerignore"
      - "docker-compose.yml"
      - "VERSION"
      - "scripts/deploy.sh"
      - "scripts/rollback.sh"
      - "Makefile"
      - ".github/workflows/deploy.yml"
      - ".github/workflows/ci.yml"
  workflow_dispatch:
    inputs:
      skip_backup:
        description: "Lewati backup DB sebelum deploy"
        type: boolean
        default: false

permissions:
  contents: read

# Cegah dua deploy jalan bersamaan di VPS yang sama.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  # Deploy hanya jalan kalau CI (tes server, build web, build image) lulus.
  ci:
    uses: ./.github/workflows/ci.yml

  deploy:
    name: SSH deploy
    needs: ci
    runs-on: ubuntu-latest
    env:
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_USER: ${{ secrets.SSH_USER }}
      SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
      APP_DIR: ${{ secrets.APP_DIR || '/var/www/ai-todo' }}
      DEPLOY_BRANCH: ${{ github.ref_name }}
      SKIP_BACKUP: ${{ inputs.skip_backup && '1' || '0' }}
    steps:
      # Kode dikirim dari sini ke VPS sebagai git bundle, jadi VPS tidak perlu
      # kredensial GitHub (repo private tetap bisa di-deploy).
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # riwayat lengkap → bundle tanpa prasyarat, rollback ke commit lama tetap bisa
          persist-credentials: false

      - name: Buat git bundle
        run: |
          set -euo pipefail
          git bundle create "$RUNNER_TEMP/aitodo.bundle" HEAD
          git bundle verify "$RUNNER_TEMP/aitodo.bundle"
          ls -lh "$RUNNER_TEMP/aitodo.bundle"

      - name: Siapkan kunci SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$SSH_HOST" || { echo "Secret SSH_HOST belum diisi (lihat CICD.md B1)."; exit 1; }
          test -n "$SSH_USER" || { echo "Secret SSH_USER belum diisi."; exit 1; }
          test -n "$SSH_PRIVATE_KEY" || { echo "Secret SSH_PRIVATE_KEY belum diisi."; exit 1; }

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy

          if [ -n "$SSH_KNOWN_HOSTS" ]; then
            printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            echo "::warning::Secret SSH_KNOWN_HOSTS kosong; host key diambil lewat ssh-keyscan (tanpa verifikasi)."
            ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          fi
          chmod 600 ~/.ssh/known_hosts

      - name: Jalankan deploy di VPS
        run: |
          set -euo pipefail
          opts=(-i ~/.ssh/id_deploy -o IdentitiesOnly=yes -o BatchMode=yes -o ConnectTimeout=15)
          remote="$SSH_USER@$SSH_HOST"

          # Folder sementara di VPS untuk bundle + deploy.sh versi commit ini. Script
          # dijalankan dari salinan ini (bukan yang di repo VPS) supaya perubahan pada
          # deploy.sh langsung berlaku, termasuk saat VPS masih memakai versi lama.
          tmp="$(ssh "${opts[@]}" -p "$SSH_PORT" "$remote" 'mktemp -d -t aitodo-deploy.XXXXXX')"
          test -n "$tmp" || { echo "Gagal membuat folder sementara di VPS."; exit 1; }
          scp "${opts[@]}" -P "$SSH_PORT" -q "$RUNNER_TEMP/aitodo.bundle" scripts/deploy.sh "$remote:$tmp/"

          ssh "${opts[@]}" -p "$SSH_PORT" "$remote" \
              "cd '$APP_DIR' && DEPLOY_APP_DIR=\"\$(pwd)\" DEPLOY_BRANCH='$DEPLOY_BRANCH' SKIP_BACKUP='$SKIP_BACKUP' \
               DEPLOY_BUNDLE='$tmp/aitodo.bundle' DEPLOY_EXPECT_SHA='$GITHUB_SHA' bash '$tmp/deploy.sh'; \
               rc=\$?; rm -rf '$tmp'; exit \$rc"

      - name: Ringkasan
        if: always()
        run: |
          {
            echo "### Deploy ${{ job.status }}"
            echo ""
            echo "- Commit: \`${{ github.sha }}\`"
            echo "- Branch: \`${{ github.ref_name }}\`"
            echo "- Server: \`$SSH_USER@$SSH_HOST:$APP_DIR\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Bersihkan kunci SSH
        if: always()
        run: rm -f ~/.ssh/id_deploy
